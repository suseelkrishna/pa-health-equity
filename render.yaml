services:
  - type: web
    plan: free
    name: pennsylvania-health-equity-dashboard
    runtime: python
    buildCommand: python -m pip install -r requirements.lock
    startCommand: PYTHONPATH=src streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
